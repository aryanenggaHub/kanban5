name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        run: |
          fail=0
          for f in index.html v2/index.html; do
            test -f "$f" || { echo "$f missing"; exit 1; }
            if grep -nE 'localStorage|sessionStorage|indexedDB|document\.cookie' "$f"; then echo "::error::storage API found in $f"; fail=1; fi
            if grep -n '!important' "$f"; then echo "::error::!important found in $f"; fail=1; fi
            if grep -nEi '<(script|link|img)[^>]+(src|href)=["'"'"']?https?://' "$f"; then echo "::error::external resource found in $f"; fail=1; fi
          done
          if grep -rnE -e '-----BEGIN' -e 'ghp_' -e 'github_pat_' -e 'AKIA' -e 'sk-[A-Za-z0-9]{10,}' -e 'xox[bp]-' -e 'AIza' --exclude-dir=.git --exclude-dir=.github --exclude-dir=.claude --exclude-dir=.agents .; then echo "::error::possible secret found"; fail=1; fi
          exit $fail
      - name: Board core tests
        run: node --test v2/board.test.mjs

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (version 1 at the root, version 2 under /v2/)
        run: mkdir -p _site/v2 && cp index.html _site/ && cp v2/index.html _site/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
